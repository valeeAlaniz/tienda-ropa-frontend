services:
  backend:
    build:
      context: ${BACKEND_PATH:-../tienda-ropa-backend}
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: sqlite:////data/db.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tienda-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/categorias/', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  frontend:
    build: .
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  tienda-data:
